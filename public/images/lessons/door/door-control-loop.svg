<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Automatic door closed-loop controller</title>
  <desc id="desc">The door simulation sends opened, closed, and person sensor signals to the student controller. The controller returns mutually exclusive open and close commands to the door mechanism.</desc>
  <defs>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#4b2e83"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#85754d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1f1b2d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="430" rx="22" fill="#f8f7fb"/>
  <text x="600" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#2b2140">Automatic door control loop</text>
  <text x="600" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5d5968">Your controller decides motion; the simulated plant reports position and occupancy.</text>

  <g filter="url(#shadow)">
    <rect x="75" y="135" width="300" height="190" rx="18" fill="#ffffff" stroke="#d7d1e1" stroke-width="2"/>
    <rect x="450" y="120" width="300" height="220" rx="18" fill="#4b2e83"/>
    <rect x="825" y="135" width="300" height="190" rx="18" fill="#ffffff" stroke="#d7d1e1" stroke-width="2"/>
  </g>

  <text x="225" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#4b2e83">Simulation sensors</text>
  <text x="225" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#2b2140">Door fully open</text>
  <text x="225" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#2b2140">Door fully closed</text>
  <text x="225" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#2b2140">Person detected</text>

  <text x="600" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Student controller</text>
  <text x="600" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#ffffff">Read feedback</text>
  <text x="600" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#ffffff">Apply safety rules</text>
  <text x="600" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#ffffff">Select one motion</text>
  <rect x="500" y="298" width="200" height="24" rx="12" fill="#b7a57a"/>
  <text x="600" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2b2140">NEVER DRIVE BOTH</text>

  <text x="975" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#4b2e83">Door mechanism</text>
  <text x="975" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#2b2140">Open command</text>
  <text x="975" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#2b2140">Close command</text>
  <text x="975" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5d5968">Motion changes the sensor feedback.</text>

  <path d="M375 185 C410 185, 415 185, 445 185" fill="none" stroke="#4b2e83" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <text x="412" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4b2e83">INPUTS</text>

  <path d="M750 250 C785 250, 790 250, 820 250" fill="none" stroke="#85754d" stroke-width="4" marker-end="url(#arrow-gold)"/>
  <text x="787" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#6c5e3b">OUTPUTS</text>

  <path d="M975 330 C975 390, 225 390, 225 330" fill="none" stroke="#4b2e83" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-purple)"/>
  <text x="600" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4b2e83">FEEDBACK CLOSES THE LOOP</text>
</svg>
