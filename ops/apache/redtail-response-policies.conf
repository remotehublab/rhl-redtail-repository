# Include this file inside the redtail.rhlab.ece.uw.edu TLS VirtualHost.
# Apache serves /static and /public directly, so Flask response hooks do not
# run for these paths in production.

<LocationMatch "^/static/gen/">
    Header always set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

<LocationMatch "^/static/(?!gen/)">
    Header always set Cache-Control "public, max-age=604800, stale-while-revalidate=86400"
</LocationMatch>

<LocationMatch "^/public/">
    Header always set Cache-Control "public, max-age=3600, stale-while-revalidate=86400"
    Header always set X-Robots-Tag "noindex, nofollow"
</LocationMatch>
