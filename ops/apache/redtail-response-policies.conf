# Include this file inside the redtail.rhlab.ece.uw.edu TLS VirtualHost.
# Apache serves /static and /public directly, so Flask response hooks do not
# run for these paths in production.

# Host-only, one-day initial HSTS rollout. Do not add includeSubDomains or
# preload without a separate review. Keep this include inside the TLS vhost.
Header always set Strict-Transport-Security "max-age=86400"

# Cover Apache-served files as well as proxied Flask responses. Clear the
# successful-response table to avoid duplicate upstream policy headers.
Header onsuccess unset Content-Security-Policy
Header always set Content-Security-Policy "frame-ancestors 'self'"
Header onsuccess unset X-Frame-Options
Header always set X-Frame-Options "SAMEORIGIN"

<LocationMatch "^/static/gen/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

<LocationMatch "^/static/(?!gen/)">
    Header set Cache-Control "public, max-age=604800, stale-while-revalidate=86400"
</LocationMatch>

<LocationMatch "^/public/">
    Header set Cache-Control "public, max-age=3600, stale-while-revalidate=86400"
    Header always set X-Robots-Tag "noindex, nofollow"
</LocationMatch>
