{% extends "public/_base.html" %}

{% block container %}
<main class="container py-4">
  <h1>{{ gettext("Authors") }}</h1>
  {% if authors %}
  <ul>
    {% for author in authors %}
    <li><a href="{{ url_for('public.view_author', author_id=author.id) }}">{{ author.name }}</a></li>
    {% endfor %}
  </ul>
  {% else %}
  <p>{{ gettext("No authors are available.") }}</p>
  {% endif %}
</main>
{% endblock %}
