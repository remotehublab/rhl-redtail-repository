name: Test system

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python quality and 95% coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt
      - run: ruff check redtail_repository tests scripts
      - name: Unit and functional tests
        run: >-
          pytest -m "not mysql"
          --cov=redtail_repository
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=json
      - name: Independent line and branch gates
        run: python scripts/check_coverage.py --line 95 --branch 95
      - name: Changed-line coverage
        run: diff-cover coverage.xml --compare-branch=origin/main --fail-under=100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: ignore

  python-310:
    name: Python 3.10 compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -m "not mysql"

  mysql:
    name: MySQL 8 migrations and integration
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0.41
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: redtail_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      FLASK_APP: autoapp
      FLASK_CONFIG: testing
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1/redtail_test
      MYSQL_TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1/redtail_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Upgrade a blank database through every migration
        run: flask db upgrade head
      - name: Run MySQL-specific integration tests
        run: pytest -m mysql tests/integration

  browser:
    name: Browser flows and accessibility
    runs-on: ubuntu-24.04
    env:
      REDTAIL_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            redtail_repository/static/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm ci
        working-directory: redtail_repository/static
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: output/playwright
          if-no-files-found: ignore

  visual:
    name: Visual regression (desktop and mobile)
    runs-on: macos-14
    env:
      REDTAIL_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            redtail_repository/static/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm ci
        working-directory: redtail_repository/static
      - run: npx playwright install chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff-artifacts
          path: output/playwright
          if-no-files-found: ignore
